name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: '1'

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .
      - name: Typecheck (builds the WebAssembly package first)
        run: npm run typecheck

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (wasm32)
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  test:
    name: Test, build and package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and WASM/TS equivalence tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package checks (publint, are-the-types-wrong)
        run: npm run check:package
      - name: Size limits
        run: npm run size
      - name: Tarball smoke test
        run: npm run smoke

  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run benchmarks
        run: npm run bench
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: warn
          retention-days: 30

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint
        run: ./actionlint -color
